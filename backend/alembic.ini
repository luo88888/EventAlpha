# Alembic 配置：从 backend/ 目录运行（uv run alembic ...）
# sqlalchemy.url 留空，由 alembic/env.py 从 Settings(.env) 注入，单一真相源 = .env

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url =
output_encoding = utf-8

# 模板与版本目录
# version_path_separator = os  # 默认即可

[post_write_hooks]
# 可选：ruff 格式化迁移脚本（需 dev 依赖已装）
# hooks = ruff
# ruff.type = console_scripts
# ruff.entrypoint = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
