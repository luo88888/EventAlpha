[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eventalpha-backend"
version = "0.1.0"
description = "EventAlpha 后端：热点事件驱动投资研究 MVP"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13",
    "pydantic>=2",
    "pydantic-settings>=2",
    "greenlet>=2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "feedparser>=6.0",
    "httpx>=0.28",
    "langchain==1.2.12",
    "langgraph==1.1.2",
    # LLM 模型工厂集成包：deepseek / openai / qwen(tongyi via community)
    "langchain-deepseek==1.0.1",
    "langchain-openai==1.2.1",
    "langchain-community==0.4.1",
    "dashscope==1.25.9",
    # 配置：YAML 解析（config.yaml 存非密钥配置）
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx",  # TestClient 需要
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
